name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust core and server (Linux)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: muriarc_test
          POSTGRES_USER: muriarc_test
          POSTGRES_PASSWORD: muriarc-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muriarc_test -d muriarc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MURIARC_TEST_DATABASE_URL: postgresql://muriarc_test:muriarc-test-password@127.0.0.1:5432/muriarc_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Documentation contracts
        run: python3 scripts/check_documentation.py
      - name: Immutable migration checksums
        run: python scripts/check_migration_checksums.py
      - name: Immutable Fixture Catalog and matrix contracts
        run: |
          python3 scripts/check_fixture_catalog.py --catalog release-fixtures/catalog.json
          python3 scripts/check_desktop_updater_config.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/compatibility_matrix.py plan \
            --mode nightly \
            --catalog release-fixtures/catalog.json \
            --definition release-fixtures/matrix.json \
            --output "${RUNNER_TEMP}/compatibility-plan.json"
          python3 scripts/check_delivery_templates.py
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Domain, data, migration, and Store clippy
        run: >-
          cargo clippy --locked
          -p muriarc-core -p muriarc-ai
          -p muriarc-store-sqlite -p muriarc-store-postgres
          -p muriarc-importer -p muriarc-data -p muriarc-snapshot
          --all-targets --all-features -- -D warnings
      - name: Server clippy
        run: cargo clippy --locked -p muriarc-server --all-targets --all-features -- -D warnings
      - name: Upgrade control-plane clippy
        run: cargo clippy --locked -p muriarc-upgrade -p muriarcctl -p muriarc-delivery -p muriarc-upgrade-executor --all-targets --all-features -- -D warnings
      - name: Release evidence clippy
        run: cargo clippy --locked -p muriarc-release-evidence -p muriarc-verifier --all-targets --all-features -- -D warnings
      - name: Domain, data, migration, and dual Store tests
        run: >-
          cargo test --locked
          -p muriarc-core -p muriarc-ai
          -p muriarc-store-sqlite -p muriarc-store-postgres
          -p muriarc-importer -p muriarc-data -p muriarc-snapshot
          --all-targets --all-features
      - name: Server, MCP, Environment Root, and API tests
        run: cargo test --locked -p muriarc-server --all-targets --all-features
      - name: Upgrade state machine, trust, CLI, and PostgreSQL fencing tests
        run: cargo test --locked -p muriarc-upgrade -p muriarcctl -p muriarc-delivery -p muriarc-upgrade-executor --all-targets --all-features
      - name: Immutable Fixture and seven-layer verifier tests
        run: cargo test --locked -p muriarc-release-evidence -p muriarc-verifier --all-targets --all-features

  ui:
    name: Vue UI and branding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          standalone: true
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Branding integrity
        run: python branding/check_branding.py
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        working-directory: ui
        run: pnpm audit --audit-level=high
      - name: UI unit tests
        working-directory: ui
        run: pnpm run test
      - name: UI typecheck
        working-directory: ui
        run: pnpm run typecheck
      - name: Responsive Web build
        working-directory: ui
        env:
          VITE_MURIARC_GATEWAY: remote
        run: pnpm run build
      - name: Install Playwright browser
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Responsive end-to-end tests
        working-directory: ui
        run: pnpm run test:e2e

  desktop-windows:
    name: Tauri desktop smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          standalone: true
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Build desktop UI
        working-directory: ui
        env:
          VITE_MURIARC_GATEWAY: local
        run: pnpm run build
      - name: Release build refuses a missing updater public key
        shell: pwsh
        run: |
          Remove-Item Env:MURIARC_DESKTOP_UPDATER_PUBLIC_KEY -ErrorAction SilentlyContinue
          $Stdout = Join-Path $env:RUNNER_TEMP 'missing-updater-key.stdout.log'
          $Stderr = Join-Path $env:RUNNER_TEMP 'missing-updater-key.stderr.log'
          # cargo is expected to fail here. Start-Process keeps native stderr
          # out of PowerShell's terminating ErrorActionPreference pipeline.
          $Cargo = (Get-Command cargo -ErrorAction Stop).Source
          $Process = Start-Process -FilePath $Cargo `
            -ArgumentList @('check', '--release', '-p', 'muriarc-desktop') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $Stdout -RedirectStandardError $Stderr
          $CargoExitCode = $Process.ExitCode
          $Output = @(
            Get-Content -LiteralPath $Stdout -Raw
            Get-Content -LiteralPath $Stderr -Raw
          ) -join "`n"
          Remove-Item -LiteralPath $Stdout, $Stderr -Force
          if ($CargoExitCode -eq 0) {
            throw "Release Desktop build unexpectedly accepted a missing updater public key."
          }
          if ($Output -notmatch 'MURIARC_DESKTOP_UPDATER_PUBLIC_KEY is required') {
            Write-Host $Output
            throw "Release Desktop build failed for an unexpected reason."
          }
      - name: Desktop strict clippy
        run: cargo clippy --locked -p muriarc-desktop --all-targets --all-features -- -D warnings
      - name: Desktop Rust tests
        run: cargo test --locked -p muriarc-desktop --all-features
      - name: Tauri no-bundle smoke build
        run: ui/node_modules/.bin/tauri.cmd build --debug --no-bundle

  container:
    name: Container and Compose build
    runs-on: ubuntu-latest
    needs: [rust-linux, ui]
    env:
      MURIARC_POSTGRES_PASSWORD: ci-compose-password
      MURIARC_LAB_ID: 00000000-0000-4000-8000-000000000001
      MURIARC_LAB_NAME: CI Lab
      MURIARC_ROOT_USER_ID: 00000000-0000-4000-8000-000000000002
      MURIARC_ROOT_USER_EMAIL: ci-root@example.org
      MURIARC_ROOT_USER_NAME: CI Environment Root
      MURIARC_ROOT_PASSWORD: ci-environment-root-password-not-for-production
      MURIARC_BOOTSTRAP_TOKEN: ci-bootstrap-token-00000000000000000000000000000000
      MURIARC_BOOTSTRAP_MCP_TOKEN: ci-mcp-token-000000000000000000000000000000000000
      MURIARC_SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build Compose Server image
        run: docker compose build server
      - name: Start Compose stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health and persistent-login smoke
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8787/api/v1/health
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-root@example.org","password":"ci-environment-root-password-not-for-production"}' \
            http://127.0.0.1:8787/api/v1/auth/login
      - name: Compose diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
