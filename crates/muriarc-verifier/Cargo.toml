muriarc-release-evidence = { path = "../release-evidence" }
muriarc-store-postgres = { path = "../store-postgres" }
muriarc-store-sqlite = { path = "../store-sqlite" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
