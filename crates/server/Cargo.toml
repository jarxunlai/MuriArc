[package]
name = "muriarc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Axum HTTP server for shared MuriArc deployments"

[features]
default = []
postgres = ["dep:muriarc-store-postgres", "dep:ring", "dep:sqlx", "dep:tracing-subscriber"]

[dependencies]
async-trait.workspace = true
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.8", features = ["json", "macros", "query"] }
base64 = "0.22.1"
chrono.workspace = true
futures-util = "0.3.31"
muriarc-ai = { path = "../ai" }
muriarc-application = { path = "../application" }
muriarc-core = { path = "../core" }
muriarc-data = { path = "../data" }
muriarc-importer = { path = "../importer" }
muriarc-store-postgres = { path = "../store-postgres", optional = true }
rand = "0.8.5"
ring = { version = "0.17.14", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sqlx = { workspace = true, optional = true, features = ["postgres"] }
subtle = "2.6.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"], optional = true }
uuid.workspace = true
zeroize = "1.9.0"

[dev-dependencies]
http-body-util = "0.1.3"
muriarc-ai = { path = "../ai", features = ["test-support"] }
muriarc-store-sqlite = { path = "../store-sqlite" }
sqlx = { workspace = true, features = ["sqlite"] }
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }

[[bin]]
name = "muriarc-server"
path = "src/main.rs"
required-features = ["postgres"]
