[package]
name = "muriarc-upgrade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fail-closed upgrade state machine and trust bootstrap for MuriArc"

[dependencies]
async-trait.workspace = true
base64 = "0.22.1"
chrono.workspace = true
muriarc-core = { path = "../core" }
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sqlx = { workspace = true, features = ["postgres"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
muriarc-store-postgres = { path = "../store-postgres" }
tempfile = "3.24.0"
