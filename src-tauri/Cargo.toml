[package]
name = "muriarc-desktop"
version.workspace = true
description = "MuriArc personal desktop application"
authors = ["MuriArc contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "muriarc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
base64 = "0.22.1"
minisign-verify = "0.2.5"
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
base64 = "0.22.1"
chrono.workspace = true
fs2 = "0.4.3"
muriarc-application = { path = "../crates/application" }
muriarc-ai = { path = "../crates/ai" }
muriarc-core = { path = "../crates/core" }
muriarc-data = { path = "../crates/data" }
muriarc-importer = { path = "../crates/importer" }
muriarc-store-sqlite = { path = "../crates/store-sqlite" }
muriarc-release-fixture = { path = "../crates/release-fixture" }
muriarc-standard-fixture = { path = "../crates/standard-fixture" }
muriarc-upgrade = { path = "../crates/upgrade" }
minisign-verify = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10.9"
sqlx = { workspace = true, features = ["sqlite"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tempfile = "3.23.0"
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize = "1.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

# The kernel keyring keeps Linux builds dependency-light. A persistent
# Secret Service backend can replace it when Linux desktop release work starts.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[dev-dependencies]
muriarc-snapshot = { path = "../crates/snapshot" }
