[package]
name = "muriarc-desktop"
version.workspace = true
description = "MuriArc personal desktop application"
authors = ["MuriArc contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "muriarc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
chrono.workspace = true
muriarc-application = { path = "../crates/application" }
muriarc-ai = { path = "../crates/ai" }
muriarc-core = { path = "../crates/core" }
muriarc-data = { path = "../crates/data" }
muriarc-importer = { path = "../crates/importer" }
muriarc-store-sqlite = { path = "../crates/store-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tauri = { version = "2", features = [] }
tempfile = "3.23.0"
thiserror.workspace = true
uuid.workspace = true
zeroize = "1.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

# The kernel keyring keeps Linux builds dependency-light. A persistent
# Secret Service backend can replace it when Linux desktop release work starts.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[dev-dependencies]
muriarc-snapshot = { path = "../crates/snapshot" }
tokio.workspace = true
